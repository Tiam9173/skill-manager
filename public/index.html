<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill Manager</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#111111; --panel2:#171717; --hover:#1f1f1f;
    --ink:#ededed; --body:#a1a1a1; --mute:#6e6e6e;
    --line:#262626; --line2:#3d3d3d;
    --link:#3291ff; --ok:#50e3c2; --warn:#f5a623; --err:#ff4d4d;
    --r6:6px; --r8:8px; --r12:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit}
  ::selection{background:#ededed;color:#0a0a0a}

  .top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,10,.86);backdrop-filter:blur(8px);z-index:10}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.3px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(80,227,194,.12)}
  .tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r6);padding:2px}
  .tab{padding:4px 12px;border-radius:4px;font-size:13px;color:var(--body)}
  .tab[aria-selected="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
  .search{flex:1;max-width:320px;margin-left:auto}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r6);padding:6px 10px;color:var(--ink);outline:none;font-size:13px}
  .search input:focus{border-color:var(--line2)}
  .btn{border:1px solid var(--line2);border-radius:var(--r6);padding:6px 12px;font-size:13px;font-weight:500;background:var(--panel);transition:background .12s,border-color .12s}
  .btn:hover{background:var(--panel2);border-color:#555}
  .btn.primary{background:var(--ink);color:#0a0a0a;border-color:var(--ink)}
  .btn.primary:hover{background:#fff}
  .btn.danger{color:var(--err);border-color:#4a2020}
  .btn.danger:hover{background:#1d0f0f;border-color:#6b2b2b}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .wrap{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 57px)}
  .list{border-right:1px solid var(--line);overflow:auto;padding:8px}
  .item{width:100%;text-align:left;padding:10px 12px;margin-bottom:2px;border-radius:var(--r6);border:1px solid transparent;display:block;position:relative}
  .item:hover{background:var(--panel)}
  .item[aria-current="true"]{background:var(--panel2);border-color:var(--line2)}
  .item[aria-current="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--link)}
  .item .name{font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:6px}
  .item .desc{color:#8a8a8a;font-size:12px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .meta{color:#6e6e6e;font:11px/1.4 var(--mono);margin-top:6px;display:flex;gap:8px}
  .pill{font:10.5px/1 var(--mono);padding:3px 6px;border-radius:999px;border:1px solid var(--line2);color:var(--body);text-transform:uppercase;letter-spacing:.04em}
  .pill.off{color:var(--warn);border-color:#4a3a17}
  .pill.dis{color:var(--mute)}
  .pill.on{color:var(--ok);border-color:#1e4d44}

  .detail{overflow:auto;padding:24px 28px}
  .empty{height:100%;display:grid;place-items:center;color:var(--mute);font-size:13px}
  .dhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .dtitle{font-size:20px;font-weight:600;letter-spacing:-.6px;line-height:28px}
  .dpath{font:12px/1.6 var(--mono);color:var(--mute);margin-top:4px;word-break:break-all}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .chip{font:11.5px/1 var(--mono);color:var(--body);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 9px}
  .chip.ok{color:var(--ok);border-color:#1e4d44}
  .chip.dis{color:var(--mute)}
  .chip.warn{color:var(--warn);border-color:#4a3a17}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
  .sect{font:11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:24px 0 10px}
  pre.md{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r8);padding:16px;overflow:auto;max-height:52vh;font:12.5px/1.65 var(--mono);color:#c9c9c9;white-space:pre-wrap;word-break:break-word}
  .files{display:grid;grid-template-columns:1fr auto;max-width:720px;gap:2px 16px;font:12px/1.9 var(--mono);color:var(--body)}
  .files .sz{color:var(--mute);text-align:right}

  .mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50}
  .mask[data-open="true"]{display:grid}
  .modal{width:min(520px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:var(--r12);padding:20px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
  .modal h3{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.3px}
  .modal p{margin:0 0 16px;color:var(--mute);font-size:12.5px}
  .field{margin-bottom:12px}
  .field label{display:block;font:11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r6);padding:8px 10px;color:var(--ink);outline:none;font-size:13px}
  .field input:focus{border-color:var(--line2)}
  .modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r8);padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.18s;max-width:80vw;z-index:60}
  .toast[data-show="true"]{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:#5a2020;color:#ffb4b4}
  .toast.ok{border-color:#1e4d44;color:#9df3e2}
  @media (max-width:820px){.wrap{grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid var(--line);max-height:40vh}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="dot"></span>Skill Manager</div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="search"><input id="q" placeholder="搜索名称或描述" autocomplete="off" /></div>
  <button class="btn" id="btnInstall">安装</button>
  <button class="btn primary" id="btnCreate">新建</button>
</div>

<div class="wrap">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="empty">选择左侧技能查看详情</div></div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const state = { source: 'codex', skills: [], current: null, q: '' };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

function toast(msg, kind = '') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast ' + kind;
  t.dataset.show = 'true';
  clearTimeout(t._h);
  t._h = setTimeout(() => (t.dataset.show = 'false'), 3200);
}

async function api(url, body) {
  const res = await fetch(url, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
  return data;
}

async function loadSources() {
  const data = await api('/api/sources');
  $('#tabs').innerHTML = Object.entries(data).map(([k, v]) =>
    `<button class="tab" role="tab" data-src="${k}" aria-selected="${k === state.source}">${esc(v.label)}${v.exists ? '' : ' · 无目录'}</button>`
  ).join('');
  $('#tabs').querySelectorAll('.tab').forEach((b) => b.onclick = () => {
    state.source = b.dataset.src; state.current = null;
    $('#tabs').querySelectorAll('.tab').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
    loadSkills();
  });
}

async function loadSkills() {
  const { skills } = await api('/api/skills?source=' + state.source);
  state.skills = skills;
  renderList();
  if (!skills.length) $('#detail').innerHTML = '<div class="empty">这个来源下还没有技能</div>';
}

function renderList() {
  const q = state.q.toLowerCase();
  const items = state.skills.filter((s) => !q || s.name.toLowerCase().includes(q) || (s.description || '').toLowerCase().includes(q));
  $('#list').innerHTML = items.map((s) => `
    <button class="item" data-name="${esc(s.name)}" data-state="${s.state}" aria-current="${state.current === s.name}">
      <div class="name">${esc(s.name)}
        ${s.state === 'disabled' ? '<span class="pill dis">disabled</span>' : ''}
        ${s.state === 'enabled' && !s.allowImplicit ? '<span class="pill off">手动</span>' : ''}
      </div>
      <div class="desc">${esc(s.description || '无描述')}</div>
      <div class="meta"><span>${s.fileCount} files</span><span>${fmt(s.bytes)}</span>${s.source ? '<span>git</span>' : ''}</div>
    </button>`).join('') || '<div class="empty" style="height:auto;padding:24px">没有匹配项</div>';
  $('#list').querySelectorAll('.item').forEach((b) => b.onclick = () => selectSkill(b.dataset.name, b.dataset.state));
}

async function selectSkill(name, st) {
  state.current = name;
  renderList();
  const cur = document.querySelector('.item[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
  const d = await api(`/api/skill?source=${state.source}&name=${encodeURIComponent(name)}&state=${st}`);
  const s = state.skills.find((x) => x.name === name) || {};
  const implicitLabel = s.hasYaml ? (s.allowImplicit ? 'allow_implicit_invocation: true' : 'allow_implicit_invocation: false') : '无 openai.yaml · 默认允许自动';
  $('#detail').innerHTML = `
    <div class="dhead">
      <div style="flex:1;min-width:240px">
        <div class="dtitle">${esc(name)}</div>
        <div class="dpath">${esc(d.dir)}</div>
      </div>
    </div>
    <div class="chips">
      <span class="chip ${d.state === 'enabled' ? 'ok' : 'dis'}">${d.state === 'enabled' ? '已启用' : '已禁用'}</span>
      <span class="chip">${s.fileCount || 0} 个文件</span>
      <span class="chip">${fmt(s.bytes || 0)}</span>
      <span class="chip ${s.allowImplicit ? 'warn' : 'ok'}">${esc(implicitLabel)}</span>
      ${s.source ? `<span class="chip">${esc(s.source.repo)}</span>` : ''}
    </div>
    <div class="actions">
      <button class="btn" id="aToggle">${d.state === 'enabled' ? '禁用' : '启用'}</button>
      <button class="btn" id="aImplicit" ${d.state === 'enabled' ? '' : 'disabled'}>${s.allowImplicit ? '改为仅手动' : '允许自动调用'}</button>
      <button class="btn" id="aUpdate" ${s.source ? '' : 'disabled title="缺少 .skill-source.json，无法自动更新"'}>更新</button>
      <button class="btn danger" id="aUninstall">卸载</button>
    </div>
    <div class="sect">Files</div>
    <div class="files">${d.files.map((f) => `<span>${esc(f.rel)}</span><span class="sz">${fmt(f.size)}</span>`).join('')}</div>
    <div class="sect">SKILL.md</div>
    <pre class="md">${esc(d.skillMd)}</pre>`;

  $('#aToggle').onclick = async () => {
    const enable = d.state !== 'enabled';
    try {
      await api('/api/toggle', { source: state.source, name, enabled: enable });
      toast(enable ? '已启用' : '已禁用（目录移入 skills-disabled）', 'ok');
      await loadSkills(); selectSkill(name, enable ? 'enabled' : 'disabled');
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#aImplicit').onclick = async () => {
    try {
      await api('/api/implicit', { source: state.source, name, allow: !s.allowImplicit });
      toast(!s.allowImplicit ? '已允许自动调用' : '已改为仅手动调用', 'ok');
      await loadSkills(); selectSkill(name, d.state);
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#aUpdate').onclick = async () => {
    if (!confirm(`从 ${s.source.repo} 重新拉取并覆盖「${name}」？旧版本会先备份。`)) return;
    try { const r = await api('/api/update', { source: state.source, name }); toast('已更新，备份：' + r.backup, 'ok'); await loadSkills(); selectSkill(name, 'enabled'); }
    catch (e) { toast(e.message, 'err'); }
  };
  $('#aUninstall').onclick = async () => {
    if (!confirm(`卸载「${name}」？目录会移到备份区，可手动恢复。`)) return;
    try { const r = await api('/api/uninstall', { source: state.source, name }); toast('已卸载，备份：' + r.backup, 'ok'); state.current = null; $('#detail').innerHTML = '<div class="empty">已卸载</div>'; await loadSkills(); }
    catch (e) { toast(e.message, 'err'); }
  };
}

function openModal(html) {
  $('#modal').innerHTML = html;
  $('#mask').dataset.open = 'true';
}
function closeModal() { $('#mask').dataset.open = 'false'; }
$('#mask').onclick = (e) => { if (e.target.id === 'mask') closeModal(); };

$('#btnInstall').onclick = () => {
  openModal(`
    <h3>从 GitHub 安装</h3>
    <p>仓库格式 owner/repo。若仓库含多个技能，先留空以获取列表。</p>
    <div class="field"><label>Repository</label><input id="mRepo" placeholder="vercel-labs/skills" /></div>
    <div class="field"><label>技能名（可选）</label><input id="mSkill" placeholder="find-skills" /></div>
    <div class="row"><button class="btn" data-close>取消</button><button class="btn primary" id="mGo">安装</button></div>`);
  $('#modal').querySelector('[data-close]').onclick = closeModal;
  $('#mGo').onclick = async () => {
    const repo = $('#mRepo').value.trim();
    const skill = $('#mSkill').value.trim();
    if (!repo) return toast('请填写仓库', 'err');
    try {
      const r = await api('/api/install', { source: state.source, repo, skill });
      if (r.needsSelection) {
        $('#mSkill').value = '';
        toast('该仓库包含多个技能：' + r.skills.join(', ') + '，请填一个再装', '');
        return;
      }
      closeModal(); toast('已安装 ' + r.installed, 'ok'); await loadSkills();
    } catch (e) { toast(e.message, 'err'); }
  };
};

$('#btnCreate').onclick = () => {
  openModal(`
    <h3>新建技能</h3>
    <p>会生成 SKILL.md 模板，写入当前来源目录。</p>
    <div class="field"><label>名称</label><input id="cName" placeholder="my-skill" /></div>
    <div class="field"><label>描述</label><input id="cDesc" placeholder="Use when ..." /></div>
    <div class="row"><button class="btn" data-close>取消</button><button class="btn primary" id="cGo">创建</button></div>`);
  $('#modal').querySelector('[data-close]').onclick = closeModal;
  $('#cGo').onclick = async () => {
    const name = $('#cName').value.trim();
    const description = $('#cDesc').value.trim();
    if (!name) return toast('请填写名称', 'err');
    try { await api('/api/create', { source: state.source, name, description }); closeModal(); toast('已创建 ' + name, 'ok'); await loadSkills(); }
    catch (e) { toast(e.message, 'err'); }
  };
};

$('#q').oninput = (e) => { state.q = e.target.value.trim(); renderList(); };

(async () => {
  try {
    const params = new URLSearchParams(location.search);
    const src = params.get('source');
    if (src && ['codex', 'workbuddy'].includes(src)) state.source = src;
    await loadSources();
    await loadSkills();
    const sk = params.get('skill');
    if (sk) {
      const found = state.skills.find((x) => x.name === sk);
      if (found) selectSkill(found.name, found.state);
    }
  } catch (e) { toast(e.message, 'err'); }
})();
</script>
</body>
</html>
