<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill Manager</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#111111; --panel2:#171717; --hover:#1f1f1f;
    --ink:#ededed; --body:#a1a1a1; --mute:#6e6e6e;
    --line:#262626; --line2:#3d3d3d;
    --link:#3291ff; --ok:#50e3c2; --warn:#f5a623; --err:#ff4d4d;
    --r6:6px; --r8:8px; --r12:12px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input{font:inherit}
  ::selection{background:#ededed;color:#0a0a0a}

  .top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,10,.86);backdrop-filter:blur(8px);z-index:10;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(80,227,194,.12)}
  .tabs{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r6);padding:2px}
  .tab{padding:4px 10px;border-radius:4px;font-size:12.5px;color:var(--body);white-space:nowrap}
  .tab[aria-selected="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
  .tab:disabled{opacity:.4;cursor:not-allowed}
  .search{flex:1;min-width:150px;max-width:300px;margin-left:auto}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r6);padding:6px 10px;color:var(--ink);outline:none;font-size:13px}
  .search input:focus{border-color:var(--line2)}
  .btn{border:1px solid var(--line2);border-radius:var(--r6);padding:6px 12px;font-size:13px;font-weight:500;background:var(--panel);transition:background .12s,border-color .12s;white-space:nowrap}
  .btn:hover{background:var(--panel2);border-color:#555}
  .btn.primary{background:var(--ink);color:#0a0a0a;border-color:var(--ink)}
  .btn.primary:hover{background:#fff}
  .btn.danger{color:var(--err);border-color:#4a2020}
  .btn.danger:hover{background:#1d0f0f;border-color:#6b2b2b}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.icon{padding:6px 9px;font:12px/1 var(--mono)}

  .wrap{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 57px)}
  .list{border-right:1px solid var(--line);overflow:auto;padding:8px}
  .item{width:100%;text-align:left;padding:10px 12px;margin-bottom:2px;border-radius:var(--r6);border:1px solid transparent;display:block;position:relative}
  .item:hover{background:var(--panel)}
  .item[aria-current="true"]{background:var(--panel2);border-color:var(--line2)}
  .item[aria-current="true"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--link)}
  .item .name{font-weight:500;font-size:13.5px;display:flex;align-items:center;gap:6px}
  .item .desc{color:#8a8a8a;font-size:12px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .item .meta{color:#6e6e6e;font:11px/1.4 var(--mono);margin-top:6px;display:flex;gap:8px}
  .pill{font:10.5px/1 var(--mono);padding:3px 6px;border-radius:999px;border:1px solid var(--line2);color:var(--body);text-transform:uppercase;letter-spacing:.04em}
  .pill.off{color:var(--warn);border-color:#4a3a17}
  .pill.dis{color:var(--mute)}

  .detail{overflow:auto;padding:24px 28px}
  .empty{height:100%;display:grid;place-items:center;color:var(--mute);font-size:13px;text-align:center;padding:24px}
  .dtitle{font-size:20px;font-weight:600;letter-spacing:-.6px;line-height:28px}
  .dpath{font:12px/1.6 var(--mono);color:var(--mute);margin-top:4px;word-break:break-all}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .chip{font:11.5px/1 var(--mono);color:var(--body);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 9px}
  .chip.ok{color:var(--ok);border-color:#1e4d44}
  .chip.dis{color:var(--mute)}
  .chip.warn{color:var(--warn);border-color:#4a3a17}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
  .sect{font:11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:24px 0 10px}
  pre.md{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r8);padding:16px;overflow:auto;max-height:52vh;font:12.5px/1.65 var(--mono);color:#c9c9c9;white-space:pre-wrap;word-break:break-word}
  .files{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font:12px/1.9 var(--mono);color:var(--body);max-width:720px}
  .files .sz{color:var(--mute);text-align:right}

  .mask{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50}
  .mask[data-open="true"]{display:grid}
  .modal{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:var(--r12);padding:20px;box-shadow:0 24px 64px rgba(0,0,0,.6);max-height:86vh;overflow:auto}
  .modal h3{margin:0 0 4px;font-size:16px;font-weight:600;letter-spacing:-.3px}
  .modal p{margin:0 0 16px;color:var(--mute);font-size:12.5px}
  .field{margin-bottom:12px}
  .field label{display:block;font:11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
  .field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r6);padding:8px 10px;color:var(--ink);outline:none;font-size:13px}
  .field input:focus{border-color:var(--line2)}
  .field .hint{font:11px/1.5 var(--mono);color:#5c5c5c;margin-top:5px;word-break:break-all}
  .modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r8);padding:10px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.18s;max-width:80vw;z-index:60}
  .toast[data-show="true"]{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:#5a2020;color:#ffb4b4}
  .toast.ok{border-color:#1e4d44;color:#9df3e2}
  .modal.wide{width:min(940px,94vw)}
  .cfg-tabs{display:flex;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r6);padding:2px;margin-bottom:16px}
  .cfg-tab{padding:5px 12px;border-radius:4px;font-size:12.5px;color:var(--body)}
  .cfg-tab[aria-selected="true"]{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
  .cfg-group{margin-bottom:18px}
  .cfg-group h4{margin:0 0 8px;font:11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:400}
  .cfg-row{display:grid;grid-template-columns:1fr 250px;gap:12px;align-items:center;padding:6px 0;border-bottom:1px solid #1a1a1a}
  .cfg-row:last-child{border-bottom:0}
  .cfg-key{font:12px/1.5 var(--mono);color:#9a9a9a;word-break:break-all}
  .cfg-key .ro{color:var(--mute);font-size:10.5px;margin-left:6px}
  .cfg-row input[type=text],.cfg-row select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r6);padding:6px 8px;color:var(--ink);font-size:12.5px;outline:none}
  .cfg-val{font:12px/1.5 var(--mono);color:var(--body);text-align:right;word-break:break-all}
  textarea.cfg-area{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r6);padding:8px;color:var(--ink);font:12px/1.6 var(--mono);outline:none;resize:vertical}
  .cfg-note{font:11.5px/1.6 var(--mono);color:#5c5c5c;margin:10px 0 0}
  .cfg-warn{background:#1a1408;border:1px solid #4a3a17;color:#e0b96a;border-radius:var(--r6);padding:8px 10px;font-size:12px;line-height:1.6;margin-bottom:10px}
  @media (max-width:900px){.wrap{grid-template-columns:1fr}.list{border-right:0;border-bottom:1px solid var(--line);max-height:38vh}}
</style>
</head>
<body>
<div class="top">
  <div class="brand"><span class="dot"></span>Skill Manager</div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="search"><input id="q" autocomplete="off" /></div>
  <button class="btn icon" id="btnLang" title="Language">EN</button>
  <button class="btn" id="btnSettings"></button>
  <button class="btn" id="btnConfig"></button>
  <button class="btn" id="btnInstall"></button>
  <button class="btn primary" id="btnCreate"></button>
</div>

<div class="wrap">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="empty" data-i18n="emptySelect"></div></div>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>

    uninstalled: '已卸载',
    installTitle: '从 GitHub 安装', installDesc: '仓库格式 owner/repo。若仓库含多个技能，先留空以获取列表。',
    repo: 'Repository', skillOptional: '技能名（可选）',
    needsSelection: '该仓库包含多个技能：{list}，请填一个再装',
    fillRepo: '请填写仓库',
    createTitle: '新建技能', createDesc: '会生成 SKILL.md 模板，写入当前来源目录。',
    name: '名称', desc: '描述',
    fillName: '请填写名称',
    okCreated: '已创建 {name}',
    settingsTitle: '来源设置', settingsDesc: '国际版与中国版若为独立安装，请分别指定技能目录；指向同一目录时会合并显示。',
    save: '保存', cancel: '取消',
    okSaved: '设置已保存',
    installed: '已安装 {name}',
    dup: '重复', dupChip: '另有 {n} 份副本', needRestart: '（需新开任务生效）',
    config: '配置', cfgDesc: '直接读写配置文件，保存前自动备份。账号级字段只读。',
    cfgCodex: 'Codex config.toml', cfgWorkbuddy: 'WorkBuddy 设置',
    cfgAccount: '账号与模型（谨慎修改）', cfgRuntime: '运行行为', cfgUi: '界面', cfgMcp: 'MCP 服务器（只读）',
    cfgProjects: '项目信任', cfgPlugins: '插件与市场（只读）', cfgHooks: 'Hooks（只读）', cfgOther: '其他（只读）',
    cfgReadonly: '只读', cfgNoChange: '没有改动', cfgSaved: '已保存，备份：{path}',
    cfgNote: '账号级字段可编辑，但改动会影响 Codex 的登录与请求。保存前会二次确认。',
    cfgAccountWarn: '账号级字段：改错可能导致 Codex 无法启动、请求失败或账号异常。密钥类字段保持只读。',
    cfgConfirmAccount: '将修改 {n} 个账号级字段（{list}）。确定保存？',
    cfgAllowWrite: '额外允许写入的路径（每行一个）', cfgRules: '文件规则（只读）',
    cfgWbNote: 'WorkBuddy 运行中可能覆写设置，改完建议重启应用。', cfgMissing: '配置文件不存在',
    dupDisable: '已禁用，但插件副本仍在，可能还会被加载',
  },
  en: {
    search: 'Search name or description',
    install: 'Install', create: 'New', settings: 'Settings',
    srcCodex: 'Codex', srcCn: 'WorkBuddy China', srcIntl: 'WorkBuddy International', srcShared: 'WorkBuddy China / International (shared)',
    emptySelect: 'Select a skill to see details',
    emptyList: 'No skills in this source',
    noMatch: 'No matches',
    noDesc: 'No description',
    filesUnit: '{n} files',
    enabled: 'Enabled', disabled: 'Disabled', manual: 'Manual',
    enable: 'Enable', disable: 'Disable',
    makeManual: 'Make manual-only', allowAuto: 'Allow auto-invoke',
    update: 'Update', uninstall: 'Uninstall',
    implicitDefault: 'No openai.yaml · auto allowed by default',
    implicitOn: 'Auto-invoke allowed', implicitOff: 'Manual only',
    files: 'Files', noSource: 'No source record, cannot auto-update',
    confirmUpdate: 'Re-fetch from {repo} and overwrite "{name}"? The old version is backed up first.',
    confirmUninstall: 'Uninstall "{name}"? The folder moves to backups and can be restored.',
    okDisabled: 'Disabled (moved to disabled dir)', okEnabled: 'Enabled',
    okManual: 'Set to manual-only', okAuto: 'Auto-invoke allowed',
    okUpdated: 'Updated, backup: {path}', okUninstalled: 'Uninstalled, backup: {path}',
    uninstalled: 'Uninstalled',
    installTitle: 'Install from GitHub', installDesc: 'Format owner/repo. Leave skill empty to list skills when the repo has several.',
    repo: 'Repository', skillOptional: 'Skill (optional)',
    needsSelection: 'This repo has multiple skills: {list}. Fill one in and retry.',
    fillRepo: 'Repository is required',
    createTitle: 'New skill', createDesc: 'Creates a SKILL.md template in the active source.',
    name: 'Name', desc: 'Description',
    fillName: 'Name is required',
    okCreated: 'Created {name}',
    settingsTitle: 'Source settings', settingsDesc: 'If China and International builds are installed separately, set their skill folders here. Identical paths are merged.',
    save: 'Save', cancel: 'Cancel',
    okSaved: 'Settings saved',
    installed: 'Installed {name}',
    dup: 'Dup', dupChip: '{n} other copy', needRestart: ' (takes effect in a new task)',
    config: 'Config', cfgDesc: 'Reads and writes config files directly, with a backup before saving. Account-level fields are read-only.',
    cfgCodex: 'Codex config.toml', cfgWorkbuddy: 'WorkBuddy settings',
    cfgAccount: 'Account & model (edit with care)', cfgRuntime: 'Runtime', cfgUi: 'Interface', cfgMcp: 'MCP servers (read-only)',
    cfgProjects: 'Project trust', cfgPlugins: 'Plugins & marketplaces (read-only)', cfgHooks: 'Hooks (read-only)', cfgOther: 'Other (read-only)',
    cfgReadonly: 'read-only', cfgNoChange: 'No changes', cfgSaved: 'Saved, backup: {path}',
    cfgNote: 'Account-level fields are editable, but they affect Codex sign-in and requests. You will be asked to confirm before saving.',
    cfgAccountWarn: 'Account-level fields: a wrong value can break Codex startup, requests, or the account. Secret fields stay read-only.',
    cfgConfirmAccount: 'This will change {n} account-level field(s) ({list}). Save anyway?',
    cfgAllowWrite: 'Extra writable paths (one per line)', cfgRules: 'File rules (read-only)',
    cfgWbNote: 'WorkBuddy may rewrite settings while running; restart the app after changes.', cfgMissing: 'Config file not found',
    dupDisable: 'Disabled, but a plugin copy still exists and may still load',
  },
};

const params0 = new URLSearchParams(location.search);
let lang = localStorage.getItem('sm-lang') || params0.get('lang') || ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh-CN' : 'en');
if (!I18N[lang]) lang = 'en';

const t = (k, vars) => {
  let s = I18N[lang][k] ?? k;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.split('{' + a + '}').join(b);
  return s;
};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const filesLabel = (n) => lang === 'zh-CN' ? `${n} 个文件` : `${n} ${n === 1 ? 'file' : 'files'}`;
const fmt = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

const state = { sources: [], tabs: [], active: null, skills: [], current: null, q: '' };

function toast(msg, kind = '') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast ' + kind;
  el.dataset.show = 'true';
  clearTimeout(el._h);
  el._h = setTimeout(() => (el.dataset.show = 'false'), 3600);
}

async function api(url, body) {
  const res = await fetch(url, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
  return data;
}

function labelFor(tab) {
  if (tab.kind === 'codex') return t('srcCodex');
  if (tab.shared) return t('srcShared');
  return tab.id === 'workbuddy-cn' ? t('srcCn') : t('srcIntl');
}

function buildTabs(sources) {
  const tabs = [];
  const byPath = new Map();
  for (const s of sources) {
    if (s.kind === 'workbuddy') {
      const key = s.path.toLowerCase();
      if (byPath.has(key)) { byPath.get(key).shared = true; continue; }
      const tab = { id: s.id, kind: s.kind, path: s.path, exists: s.exists, shared: false };
      byPath.set(key, tab);
      tabs.push(tab);
    } else {
      tabs.push({ id: s.id, kind: s.kind, path: s.path, exists: s.exists, shared: false });
    }
  }
  return tabs;
}

async function loadSources() {
  const data = await api('/api/sources');
  state.sources = data.sources;
  state.tabs = buildTabs(data.sources);
  if (!state.tabs.find((x) => x.id === state.active)) state.active = state.tabs[0] ? state.tabs[0].id : null;
  renderTabs();
}

function renderTabs() {
  $('#tabs').innerHTML = state.tabs.map((tb) =>
    `<button class="tab" role="tab" data-id="${tb.id}" aria-selected="${tb.id === state.active}" ${tb.exists ? '' : 'disabled title="' + esc(tb.path) + '"'}>${esc(labelFor(tb))}</button>`
  ).join('');
  $('#tabs').querySelectorAll('.tab').forEach((b) => {
    b.onclick = () => { state.active = b.dataset.id; state.current = null; renderTabs(); loadSkills(); };
  });
}

async function loadSkills() {
  if (!state.active) {
    $('#list').innerHTML = '';
    $('#detail').innerHTML = `<div class="empty">${esc(t('emptyList'))}</div>`;
    return;
  }
  const { skills } = await api('/api/skills?source=' + encodeURIComponent(state.active));
  state.skills = skills;
  renderList();
  if (!skills.length) $('#detail').innerHTML = `<div class="empty">${esc(t('emptyList'))}</div>`;
}

function renderList() {
  const q = state.q.toLowerCase();
  const items = state.skills.filter((s) => !q || s.name.toLowerCase().includes(q) || (s.description || '').toLowerCase().includes(q));
  $('#list').innerHTML = items.map((s) => `
    <button class="item" data-name="${esc(s.name)}" data-state="${s.state}" aria-current="${state.current === s.name}">
      <div class="name">${esc(s.name)}
        ${s.state === 'disabled' ? `<span class="pill dis">${esc(t('disabled'))}</span>` : ''}
        ${s.state === 'enabled' && !s.allowImplicit ? `<span class="pill off">${esc(t('manual'))}</span>` : ''}
        ${s.duplicates && s.duplicates.length ? `<span class="pill off" title="${esc(s.duplicates.join('\n'))}">${esc(t('dup'))}</span>` : ''}
      </div>
      <div class="desc">${esc(s.description || t('noDesc'))}</div>
      <div class="meta"><span>${esc(filesLabel(s.fileCount))}</span><span>${fmt(s.bytes)}</span>${s.source ? '<span>git</span>' : ''}</div>
    </button>`).join('') || `<div class="empty" style="height:auto;padding:24px">${esc(t('noMatch'))}</div>`;
  $('#list').querySelectorAll('.item').forEach((b) => b.onclick = () => selectSkill(b.dataset.name, b.dataset.state));
}

async function selectSkill(name, st) {
  state.current = name;
  renderList();
  const cur = document.querySelector('.item[aria-current="true"]');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
  const d = await api(`/api/skill?source=${encodeURIComponent(state.active)}&name=${encodeURIComponent(name)}&state=${st}`);
  const s = state.skills.find((x) => x.name === name) || {};
  const implicitLabel = s.hasYaml ? (s.allowImplicit ? t('implicitOn') : t('implicitOff')) : t('implicitDefault');
  $('#detail').innerHTML = `
    <div class="dtitle">${esc(name)}</div>
    <div class="dpath">${esc(d.dir)}</div>
    <div class="chips">
      <span class="chip ${d.state === 'enabled' ? 'ok' : 'dis'}">${esc(d.state === 'enabled' ? t('enabled') : t('disabled'))}</span>
      <span class="chip">${esc(filesLabel(s.fileCount || 0))}</span>
      <span class="chip">${fmt(s.bytes || 0)}</span>
      <span class="chip ${s.allowImplicit ? 'warn' : 'ok'}">${esc(implicitLabel)}</span>
      ${d.duplicates && d.duplicates.length ? `<span class="chip warn" title="${esc(d.duplicates.join('\n'))}">${esc(t('dupChip', { n: d.duplicates.length }))}</span>` : ''}
      ${s.source ? `<span class="chip">${esc(s.source.repo)}</span>` : ''}
    </div>
    <div class="actions">
      <button class="btn" id="aToggle">${esc(d.state === 'enabled' ? t('disable') : t('enable'))}</button>
      <button class="btn" id="aImplicit" ${d.state === 'enabled' ? '' : 'disabled'}>${esc(s.allowImplicit ? t('makeManual') : t('allowAuto'))}</button>
      <button class="btn" id="aUpdate" ${s.source ? '' : `disabled title="${esc(t('noSource'))}"`}>${esc(t('update'))}</button>
      <button class="btn danger" id="aUninstall">${esc(t('uninstall'))}</button>
    </div>
    <div class="sect">${esc(t('files'))}</div>
    <div class="files">${d.files.map((f) => `<span>${esc(f.rel)}</span><span class="sz">${fmt(f.size)}</span>`).join('')}</div>
    <div class="sect">SKILL.md</div>
    <pre class="md">${esc(d.skillMd)}</pre>`;

  $('#aToggle').onclick = async () => {
    const enable = d.state !== 'enabled';
    try {
      await api('/api/toggle', { source: state.active, name, enabled: enable });
      if (!enable && d.duplicates && d.duplicates.length) toast(t('dupDisable'), 'err');
      else toast((enable ? t('okEnabled') : t('okDisabled')) + t('needRestart'), 'ok');
      await loadSkills();
      selectSkill(name, enable ? 'enabled' : 'disabled');
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#aImplicit').onclick = async () => {
    try {
      await api('/api/implicit', { source: state.active, name, allow: !s.allowImplicit });
      toast((!s.allowImplicit ? t('okAuto') : t('okManual')) + t('needRestart'), 'ok');
      await loadSkills();
      selectSkill(name, d.state);
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#aUpdate').onclick = async () => {
    if (!confirm(t('confirmUpdate', { repo: s.source.repo, name }))) return;
    try {
      const r = await api('/api/update', { source: state.active, name });
      toast(t('okUpdated', { path: r.backup }) + t('needRestart'), 'ok');
      await loadSkills();
      selectSkill(name, 'enabled');
    } catch (e) { toast(e.message, 'err'); }
  };
  $('#aUninstall').onclick = async () => {
    if (!confirm(t('confirmUninstall', { name }))) return;
    try {
      const r = await api('/api/uninstall', { source: state.active, name });
      toast(t('okUninstalled', { path: r.backup }) + t('needRestart'), 'ok');
      state.current = null;
      $('#detail').innerHTML = `<div class="empty">${esc(t('uninstalled'))}</div>`;
      await loadSkills();
    } catch (e) { toast(e.message, 'err'); }
  };
}

function openModal(html) { $('#modal').innerHTML = html; $('#mask').dataset.open = 'true'; }
function closeModal() { $('#mask').dataset.open = 'false'; $('#modal').classList.remove('wide'); }
$('#mask').onclick = (e) => { if (e.target.id === 'mask') closeModal(); };

$('#btnInstall').onclick = () => {
  openModal(`
    <h3>${esc(t('installTitle'))}</h3>
    <p>${esc(t('installDesc'))}</p>
    <div class="field"><label>${esc(t('repo'))}</label><input id="mRepo" placeholder="vercel-labs/skills" /></div>
    <div class="field"><label>${esc(t('skillOptional'))}</label><input id="mSkill" placeholder="find-skills" /></div>
    <div class="row"><button class="btn" data-close>${esc(t('cancel'))}</button><button class="btn primary" id="mGo">${esc(t('install'))}</button></div>`);
  $('#modal').querySelector('[data-close]').onclick = closeModal;
  $('#mGo').onclick = async () => {
    const repo = $('#mRepo').value.trim();
    const skill = $('#mSkill').value.trim();
    if (!repo) return toast(t('fillRepo'), 'err');
    try {
      const r = await api('/api/install', { source: state.active, repo, skill });
      if (r.needsSelection) {
        $('#mSkill').value = '';
        toast(t('needsSelection', { list: r.skills.join(', ') }), '');
        return;
      }
      closeModal();
      toast(t('installed', { name: r.installed }) + t('needRestart'), 'ok');
      await loadSkills();
    } catch (e) { toast(e.message, 'err'); }
  };
};

$('#btnCreate').onclick = () => {
  openModal(`
    <h3>${esc(t('createTitle'))}</h3>
    <p>${esc(t('createDesc'))}</p>
    <div class="field"><label>${esc(t('name'))}</label><input id="cName" placeholder="my-skill" /></div>
    <div class="field"><label>${esc(t('desc'))}</label><input id="cDesc" placeholder="Use when ..." /></div>
    <div class="row"><button class="btn" data-close>${esc(t('cancel'))}</button><button class="btn primary" id="cGo">${esc(t('create'))}</button></div>`);
  $('#modal').querySelector('[data-close]').onclick = closeModal;
  $('#cGo').onclick = async () => {
    const name = $('#cName').value.trim();
    const description = $('#cDesc').value.trim();
    if (!name) return toast(t('fillName'), 'err');
    try {
      await api('/api/create', { source: state.active, name, description });
      closeModal();
      toast(t('okCreated', { name }) + t('needRestart'), 'ok');
      await loadSkills();
    } catch (e) { toast(e.message, 'err'); }
  };
};

$('#btnSettings').onclick = () => {
  const rows = state.sources.map((s) => {
    const tab = { id: s.id, kind: s.kind, shared: false };
    return `
    <div class="field">
      <label>${esc(labelFor(tab))}</label>
      <input data-cfg="${esc(s.id)}" value="${esc(s.path)}" />
      <div class="hint">${s.exists ? '' : '✕ '}${esc(s.path)}</div>
    </div>`;
  }).join('');
  openModal(`
    <h3>${esc(t('settingsTitle'))}</h3>
    <p>${esc(t('settingsDesc'))}</p>
    ${rows}
    <div class="row"><button class="btn" data-close>${esc(t('cancel'))}</button><button class="btn primary" id="sGo">${esc(t('save'))}</button></div>`);
  $('#modal').querySelector('[data-close]').onclick = closeModal;
  $('#sGo').onclick = async () => {
    const sources = [...$('#modal').querySelectorAll('[data-cfg]')].map((i) => ({ id: i.dataset.cfg, path: i.value.trim() }));
    try {
      await api('/api/config', { sources, lang });
      closeModal();
      toast(t('okSaved'), 'ok');
      await loadSources();
      await loadSkills();
    } catch (e) { toast(e.message, 'err'); }
  };
};

function applyStaticText() {
  $('#btnInstall').textContent = t('install');
  $('#btnCreate').textContent = t('create');
  $('#btnSettings').textContent = t('settings');
  $('#btnConfig').textContent = t('config');
  $('#q').placeholder = t('search');
  $('#btnLang').textContent = lang === 'zh-CN' ? 'EN' : '中文';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
}

let cfgState = { codex: null, wb: null, tab: 'codex', fieldMap: new Map() };
const CFG_GROUPS = ['account','runtime','ui','projects','mcp','plugins','hooks','other'];
const CFG_LABEL = { account:'cfgAccount', runtime:'cfgRuntime', ui:'cfgUi', mcp:'cfgMcp', projects:'cfgProjects', plugins:'cfgPlugins', hooks:'cfgHooks', other:'cfgOther' };

async function openConfigModal() {
  openModal('<h3>' + esc(t('config')) + '</h3><p>' + esc(t('cfgDesc')) + '</p><div id="cfgBody"></div>');
  $('#modal').classList.add('wide');
  $('#cfgBody').innerHTML = '<div class="empty" style="height:auto;padding:20px">...</div>';
  try {
    const [codex, wb] = await Promise.all([api('/api/config/codex'), api('/api/config/workbuddy')]);
    cfgState = { codex: codex, wb: wb, tab: 'codex', fieldMap: new Map() };
    renderConfig();
  } catch (e) { toast(e.message, 'err'); }
}

function renderConfig() {
  const tabs = '<div class="cfg-tabs">'
    + '<button class="cfg-tab" data-tab="codex" aria-selected="' + (cfgState.tab === 'codex') + '">' + esc(t('cfgCodex')) + '</button>'
    + '<button class="cfg-tab" data-tab="workbuddy" aria-selected="' + (cfgState.tab === 'workbuddy') + '">' + esc(t('cfgWorkbuddy')) + '</button>'
    + '</div>';
  const body = cfgState.tab === 'codex' ? renderCodexCfg() : renderWbCfg();
  $('#cfgBody').innerHTML = tabs + body + '<div class="row"><button class="btn" data-close>' + esc(t('cancel')) + '</button><button class="btn primary" id="cfgSave">' + esc(t('save')) + '</button></div>';
  $('#cfgBody').querySelectorAll('.cfg-tab').forEach(function (b) { b.onclick = function () { cfgState.tab = b.dataset.tab; renderConfig(); }; });
  $('#cfgBody').querySelector('[data-close]').onclick = closeModal;
  $('#cfgSave').onclick = saveConfig;
}

function renderCodexCfg() {
  if (!cfgState.codex || !cfgState.codex.exists) return '<div class="empty" style="height:auto;padding:20px">' + esc(t('cfgMissing')) + '</div>';
  cfgState.fieldMap = new Map();
  return CFG_GROUPS.filter(function (g) { return (cfgState.codex.groups[g] || []).length; }).map(function (g) {
    const rows = cfgState.codex.groups[g].map(function (f) {
      const id = g + '::' + f.section + '::' + f.key;
      cfgState.fieldMap.set(id, f);
      let ctrl;
      if (!f.editable) {
        const shown = f.secret ? '\u2022\u2022\u2022\u2022\u2022\u2022' : (f.type === 'array' ? f.raw : String(f.value));
        ctrl = '<div class="cfg-val">' + esc(shown) + '</div>';
      } else if (f.type === 'bool') {
        ctrl = '<select data-id="' + esc(id) + '"><option value="true"' + (f.value === true ? ' selected' : '') + '>true</option><option value="false"' + (f.value === false ? ' selected' : '') + '>false</option></select>';
      } else {
        ctrl = '<input type="text" data-id="' + esc(id) + '" value="' + esc(String(f.value)) + '" />';
      }
      return '<div class="cfg-row"><div class="cfg-key">' + esc(f.label) + (f.editable ? '' : '<span class="ro">' + esc(t('cfgReadonly')) + '</span>') + '</div>' + ctrl + '</div>';
    }).join('');
    return '<div class="cfg-group"><h4>' + esc(t(CFG_LABEL[g])) + '</h4>' + (g === 'account' ? '<div class="cfg-warn">' + esc(t('cfgAccountWarn')) + '</div>' : '') + rows + '</div>';
  }).join('') + '<p class="cfg-note">' + esc(t('cfgNote')) + '</p>';
}

function renderWbCfg() {
  const wb = cfgState.wb || {};
  const app = wb.app || {};
  const loc = app.locale || 'zh-CN';
  const allow = (wb.extraAllowWrite || []).join(String.fromCharCode(10));
  const rules = (wb.ruleGroups || []).map(function (r) {
    return '<div class="cfg-row"><div class="cfg-key">' + esc(r.kind) + '</div><div class="cfg-val">' + r.count + ' rules' + (r.customized ? ' \u00b7 customized' : '') + '</div></div>';
  }).join('') || '<div class="cfg-val">\u2014</div>';
  return '<div class="cfg-group"><h4>app-config.json</h4>'
    + '<div class="cfg-row"><div class="cfg-key">locale</div><select data-wb="locale"><option value="zh-CN"' + (loc === 'zh-CN' ? ' selected' : '') + '>zh-CN</option><option value="en"' + (loc === 'en' ? ' selected' : '') + '>en</option></select></div>'
    + '<div class="cfg-row"><div class="cfg-key">defaultWorkspacePath</div><input type="text" data-wb="workspace" value="' + esc(app.defaultWorkspacePath || '') + '" /></div>'
    + '<div class="cfg-row"><div class="cfg-key">sandboxSafetyEnabled</div><select data-wb="sandbox"><option value="true"' + (app.sandboxSafetyEnabled ? ' selected' : '') + '>true</option><option value="false"' + (!app.sandboxSafetyEnabled ? ' selected' : '') + '>false</option></select></div>'
    + '</div>'
    + '<div class="cfg-group"><h4>' + esc(t('cfgAllowWrite')) + '</h4><textarea class="cfg-area" id="wbAllow">' + esc(allow) + '</textarea></div>'
    + '<div class="cfg-group"><h4>' + esc(t('cfgRules')) + '</h4>' + rules + '</div>'
    + '<p class="cfg-note">' + esc(t('cfgWbNote')) + '</p>';
}

async function saveConfig() {
  try {
    if (cfgState.tab === 'codex') {
      const updates = [];
      $('#cfgBody').querySelectorAll('[data-id]').forEach(function (el) {
        const f = cfgState.fieldMap.get(el.dataset.id);
        if (!f || !f.editable) return;
        let v = el.value;
        if (f.type === 'bool') v = v === 'true';
        else if (f.type === 'number') v = Number(v);
        if (v !== f.value) updates.push({ section: f.section, key: f.key, value: v });
      });
      if (!updates.length) return toast(t('cfgNoChange'), '');
      const riskyKeys = [];
      updates.forEach(function (u) {
        cfgState.fieldMap.forEach(function (f) {
          if (f.section === u.section && f.key === u.key && f.group === 'account') riskyKeys.push(u.key);
        });
      });
      if (riskyKeys.length) {
        const ok = confirm(t('cfgConfirmAccount', { n: riskyKeys.length, list: riskyKeys.join(', ') }));
        if (!ok) return;
      }
      const r = await api('/api/config/codex', { updates: updates });
      toast(t('cfgSaved', { path: r.backup }), 'ok');
    } else {
      const locale = $('#cfgBody').querySelector('[data-wb="locale"]').value;
      const workspace = $('#cfgBody').querySelector('[data-wb="workspace"]').value.trim();
      const sandbox = $('#cfgBody').querySelector('[data-wb="sandbox"]').value === 'true';
      const allow = $('#wbAllow').value.split(String.fromCharCode(10)).map(function (x) { return x.trim(); }).filter(Boolean);
      const r = await api('/api/config/workbuddy', { app: { locale: locale, defaultWorkspacePath: workspace, sandboxSafetyEnabled: sandbox }, extraAllowWrite: allow });
      toast(t('cfgSaved', { path: r.appBackup || r.settingsBackup || '' }), 'ok');
    }
    closeModal();
  } catch (e) { toast(e.message, 'err'); }
}

$('#btnConfig').onclick = openConfigModal;

$('#btnLang').onclick = async () => {
  lang = lang === 'zh-CN' ? 'en' : 'zh-CN';
  localStorage.setItem('sm-lang', lang);
  applyStaticText();
  renderTabs();
  renderList();
  if (state.current) {
    const s = state.skills.find((x) => x.name === state.current);
    if (s) selectSkill(s.name, s.state);
  } else {
    $('#detail').innerHTML = `<div class="empty">${esc(t('emptySelect'))}</div>`;
  }
};

(async () => {
  try {
    applyStaticText();
    await loadSources();
    await loadSkills();
    const sk = params0.get('skill');
    if (sk) {
      const found = state.skills.find((x) => x.name === sk);
      if (found) selectSkill(found.name, found.state);
    }
    if (params0.get('config')) {
      await openConfigModal();
      if (params0.get('config') === 'workbuddy') { cfgState.tab = 'workbuddy'; renderConfig(); }
    }
  } catch (e) { toast(e.message, 'err'); }
})();
</script>
</body>
